services:
  - type: web
    name: fornace-app
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/saude/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fornace-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true

databases:
  - name: fornace-postgres
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: fornace
    user: fornace
    ipAllowList: []
